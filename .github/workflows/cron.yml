# Runs Postpilot's background jobs (publish due posts, render images, refresh metrics, autopilot) on hosts
# without a long-running process. GitHub runs schedules on a best-effort basis, usually within a few minutes.
# Needs secret CRON_SECRET (the same value as the app's CRON_SECRET). Set repository variable APP_URL to override the default address.
name: Postpilot jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: postpilot-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron
        env:
          APP_URL: ${{ vars.APP_URL || 'https://postpilot-phi-five.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET not configured"; exit 0; fi
          curl --fail-with-body -sS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
